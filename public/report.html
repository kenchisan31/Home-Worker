<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Báo cáo vi phạm – ThợViệt</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><header><div class="in nav"><a class="logo" href="/index.html">ThợViệt</a><a href="/index.html">Trang chủ</a></div></header><main class="in" style="max-width:620px;margin:28px auto"><h1>Báo cáo nội dung / tài khoản</h1><p class="mu">Báo cáo sẽ được gửi đến đội ngũ quản trị để xem xét.</p><form id="f" class="card" style="padding:16px"><label class="fl">Loại đối tượng<select id="type"><option value="user">Tài khoản</option><option value="worker">Hồ sơ thợ</option><option value="job">Dự án</option><option value="message">Tin nhắn</option></select></label><label class="fl">Mã đối tượng<input id="target" required maxlength="80" placeholder="Nhập ID tài khoản / hồ sơ / dự án / tin nhắn"></label><label class="fl">Lý do<select id="reason"><option>Thông tin giả mạo</option><option>Spam / quảng cáo không phù hợp</option><option>Lừa đảo / yêu cầu thanh toán bất thường</option><option>Nội dung xúc phạm / quấy rối</option><option>Thông tin sai sự thật</option><option>Khác</option></select></label><label class="fl">Mô tả thêm<textarea id="details" maxlength="1500" rows="5"></textarea></label><button class="btn primary" type="submit">Gửi báo cáo</button><p id="msg" class="mu"></p></form></main><script>
const $=id=>document.getElementById(id);$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Đang gửi…';try{const r=await fetch('/api/rpc',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'report_create',args:{targetType:$('type').value,targetId:$('target').value,reason:$('reason').value,details:$('details').value}})});const d=await r.json();if(!r.ok)throw Error(d.error||'Không gửi được');$('msg').textContent='Đã gửi báo cáo #'+d.id+'. Cảm ơn bạn.';$('f').reset()}catch(err){$('msg').textContent=err.message}};
</script><script src="/notifications.js" defer></script></body></html>
