<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ThợViệt – Dành cho thợ</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#e8590c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ThợViệt"></head><body>
<header><div class="in nav" id="nav"></div></header><main class="in" id="app"></main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
let fc="",fp="",edit=false;

/* ---------- TÌM VIỆC kiểu TopCV: việc phù hợp / việc đề xuất (vuốt ngang) / việc khác ---------- */
let SKIP=null;
const skipKey=()=>"tv_skip_"+(S?S.email:"");
const skipSet=()=>{if(!SKIP){try{SKIP=new Set(JSON.parse(localStorage.getItem(skipKey())||"[]"))}catch(e){SKIP=new Set()}}return SKIP};
const skipAdd=id=>{const s=skipSet();s.add(id);try{localStorage.setItem(skipKey(),JSON.stringify([...s].slice(-300)))}catch(e){}};
const jBid=(j,me)=>me&&j.bids.find(b=>b.w===me.id);
const jOpen=(j,me)=>!j.chosen&&!jBid(j,me);
const jSkill=(j,me)=>me?Math.min(3,(me.skills||[]).filter(k=>kwMatch(j.title+" "+(j.desc||""),k)).length):0;
const jMatch=(j,me)=>({cat:!!me&&j.cat===me.cat,city:!!me&&!!me.city&&normCity(j.city)===normCity(me.city)});
const jScore=(j,me)=>{const m=jMatch(j,me);return (m.cat?3:0)+(m.city?3:0)+jSkill(j,me)};
function jGroups(me){
  const sk=skipSet(),fit=[],sug=[];
  DB.jobs.forEach(j=>{if(!me||!jOpen(j,me)||sk.has(j.id))return;const m=jMatch(j,me);if(m.cat&&m.city)fit.push(j);else if(m.cat||m.city||jSkill(j,me))sug.push(j)});
  const by=(a,b)=>jScore(b,me)-jScore(a,me)||b.id-a.id;fit.sort(by);sug.sort(by);
  const shown=new Set(fit.concat(sug).map(j=>j.id));
  return{fit,sug,rest:DB.jobs.filter(j=>!shown.has(j.id))};
}
const jCard=(j,me,mode)=>{const b=jBid(j,me),img=j.byLogo||(j.photos||[])[0],st=b?`<span class="tag">✅ Đã báo giá ${esc(b.p)}</span>`:j.chosen?'<span class="tag">Đã tuyển xong</span>':"";
return`<div class="jc"><div class="jh"><div class="jl"${img?` style="background-image:url('${esc(img)}')"`:""}>${img?"":ini(j.byName||j.title)}</div><div class="jm"><div class="jt">${esc(j.title)}</div><div class="jo">${esc(j.byName)}</div></div></div><div class="jk"><div><b>Lương:</b> ${esc(j.budget)}</div><div><b>Địa chỉ:</b> ${esc(jAddr(j))}</div></div><div class="jx"><span>${ICON[j.cat]} ${esc(j.cat)}</span>${j.days?`<span>⏱ ${esc(j.days)}</span>`:""}</div><div class="jb"><button class="btn" onclick="jView(${j.id})">Xem tin</button>${mode==="s"?`<button class="btn g" onclick="jSkip(${j.id})">Bỏ qua</button>`:st}</div></div>`};
const hsBox=(id,l,me)=>`<div class="hw"><button class="hn l" onclick="hsGo('${id}',-1)">‹</button><div class="hs" id="${id}">${l.map(j=>jCard(j,me,"s")).join("")}</div><button class="hn r" onclick="hsGo('${id}',1)">›</button></div>`;
const hsGo=(id,d)=>{const e=document.getElementById(id);if(e)e.scrollBy({left:d*Math.max(240,e.clientWidth*.8),behavior:"smooth"})};
function jSkip(id){const sc=[...document.querySelectorAll(".hs")].map(e=>e.scrollLeft);skipAdd(id);vViec();document.querySelectorAll(".hs").forEach((e,i)=>e.scrollLeft=sc[i]||0)}
function vViec(){const me=myShop(),g=jGroups(me);
$("#app").innerHTML=`<h1>Việc đang tuyển</h1><div class="mu">Báo giá theo công để nhận việc.</div>
<div class="sh"><h2>🎯 Việc phù hợp${g.fit.length?` <span class="mu">(${g.fit.length})</span>`:""}</h2></div>${!me?`<div class="card"><b>Hãy tạo gian hàng</b> để nhận gợi ý việc đúng ngành và khu vực của bạn.<div style="margin-top:8px"><button class="btn" onclick="location.hash='gianhang'">Tạo gian hàng</button></div></div>`:g.fit.length?hsBox("hs1",g.fit,me):'<div class="card mu">Chưa có việc đúng ngành và khu vực của bạn. Hãy xem các việc đề xuất bên dưới.</div>'}
${g.sug.length?`<div class="sh"><h2>✨ Việc đề xuất <span class="mu">(${g.sug.length})</span></h2></div>${hsBox("hs2",g.sug,me)}`:""}
<div class="sh"><h2>📋 Việc khác</h2></div><div class="bar"><select id="c">${catOpts(1)}</select><div class="cb" id="cb-p"></div></div><div class="grid" id="oth"></div>`;
$("#c").value=fc;$("#c").onchange=e=>{fc=e.target.value;othDraw()};comboInit("cb-p",PROV.map(p=>p[0]),fp,"Tất cả tỉnh/thành",v=>{fp=v;othDraw()},provAlias);othDraw()}
function othDraw(){const me=myShop(),l=jGroups(me).rest.filter(j=>(!fc||j.cat===fc)&&(!fp||normCity(j.city)===fp));$("#oth").innerHTML=l.map(j=>jCard(j,me,"o")).join("")||'<p class="mu">Không có việc nào.</p>'}
function jView(id,tab){const j=DB.jobs.find(x=>x.id===id);if(!j)return;const me=myShop(),b=jBid(j,me),oth=j.by?DB.jobs.filter(x=>x.by===j.by&&x.id!==j.id):[],img=j.byLogo||(j.photos||[])[0];
mclose();const d=document.createElement("div");d.className="am jv";d.id="mdl";d.onclick=e=>{if(e.target===d)mclose()};
const row=(ic,l,v)=>`<div class="jr"><span class="ji">${ic}</span><div><b>${l}:</b> ${v}</div></div>`;
const info=row("💰","Mức lương",`<b class="rd">${esc(j.budget)}</b>`)+row("📍","Địa điểm",esc(jAddr(j))+(j.addr?` <a href="${esc(mapUrl(j))}" target="_blank" rel="noopener">(Xem bản đồ)</a>`:""))+row(ICON[j.cat]||"🛠","Ngành nghề",esc(j.cat))+(j.days?row("⏱","Số công dự kiến",esc(j.days)):"")+row("🏢","Chủ dự án",esc(j.byName||"—"));
const main=tab==="x"?`<div style="display:grid;gap:10px;margin-top:12px">${oth.map(x=>jCard(x,me,"o")).join("")}</div>`:`<div style="margin-top:6px">${info}</div>${j.desc?`<h4 class="jsec">MÔ TẢ CÔNG VIỆC</h4><div class="pre">${esc(j.desc)}</div>`:""}${(j.photos||[]).length?`<h4 class="jsec">ẢNH DỰ ÁN</h4>${jobPh(j)}`:""}<div id="b${j.id}"></div>`;
const act=b?`<span class="tag">✅ Đã báo giá ${esc(b.p)}</span>`:j.chosen?'<span class="tag">Đã tuyển xong</span>':`<button class="btn" style="flex:1" onclick="bidf(${j.id});var e=document.getElementById('b${j.id}');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})">Báo giá ngay</button>`;
d.innerHTML=`<div class="amp jd"><div class="jdh"><b>Chi tiết việc làm</b><span class="x2" onclick="mclose()">✕</span></div><div class="jdb"><div class="jh" style="margin-top:4px"><div class="jl big"${img?` style="background-image:url('${esc(img)}')"`:""}>${img?"":ini(j.byName||j.title)}</div><div class="jm"><div class="jt" style="font-size:18px;-webkit-line-clamp:3">${esc(j.title)}</div><div class="jo">${esc(j.byName)}</div></div></div>${oth.length?`<div class="jtb"><button class="${tab==="x"?"":"on"}" onclick="jView(${j.id})">THÔNG TIN</button><button class="${tab==="x"?"on":""}" onclick="jView(${j.id},'x')">VIỆC CÙNG CHỦ (${oth.length})</button></div>`:'<div style="height:8px"></div>'}${main}</div><div class="jdf">${j.by&&me?`<button class="btn g" onclick="mclose();chatOwner(${j.id})">💬 Nhắn tin</button>`:""}${act}</div></div>`;document.body.appendChild(d)}
function bidf(id){if(!myShop()){mclose();alert("Hãy tạo gian hàng trước để chủ dự án xem năng lực của bạn.");location.hash="gianhang";return}
$("#b"+id).innerHTML=`<div class="f">${moneyInp("bp","","Giá đề xuất, VD: 550.000")}<textarea id="bm" placeholder="Lời nhắn cho chủ dự án"></textarea><button class="btn" id="bs">Gửi báo giá</button></div>`;
$("#bs").onclick=()=>{const p=moneyVal("bp");if(!p)return;DB.jobs.find(j=>j.id===id).bids.push({w:myShop().id,p,m:$("#bm").value.trim()});save();mclose();vViec()}}
function vBids(){const me=myShop(),l=me?DB.jobs.filter(j=>j.bids.some(b=>b.w===me.id)):[];$("#app").innerHTML=`<h1>Báo giá của tôi</h1>${l.map(j=>{const b=j.bids.find(x=>x.w===me.id);return`<div class="card bd" style="margin-top:10px"><div><b>${esc(j.title)}</b><div class="mu">${esc(j.byName)} · ${/^Thỏa thuận/.test(j.budget)?"giá thỏa thuận":"giá chủ đưa "+esc(j.budget)}</div></div><div><b>${esc(b.p)}</b><div class="mu">${j.chosen===me.id?"🎉 Bạn đã được chọn":j.chosen?"Chủ đã chọn thợ khác":"Đang chờ phản hồi"}</div>${j.chosen===me.id?(hasWork(me.id,j.id)?'<span class="tag">🟠 Đang nhận việc</span>':`<button class="btn" onclick="acceptJob(${j.id})">Nhận việc</button>`):""}</div></div>`}).join("")||'<p class="mu">Bạn chưa báo giá dự án nào.</p>'}`}
function statusCard(me){const a=me.active||[];
if(!a.length&&!me.busy)return`<div class="card" style="margin-bottom:12px"><div class="bd"><div><b style="color:#2a9d4a">🟢 Đang rảnh</b><div class="mu">Chủ dự án thấy bạn đang sẵn sàng nhận việc.</div></div><button class="btn" onclick="setBusy(true)">🟠 Chuyển sang Đang nhận việc</button></div></div>`;
return`<div class="card" style="margin-bottom:12px;border-color:var(--ac)"><div class="bd"><div><b style="color:var(--ac)">🟠 Đang nhận việc${a.length?` (${a.length})`:""}</b>${a.length?"":'<div class="mu">Bạn tự chuyển sang trạng thái này, chủ dự án sẽ thấy bạn đang bận.</div>'}</div>${a.length?"":'<button class="btn" onclick="setBusy(false)">🟢 Chuyển lại Đang rảnh</button>'}</div>${a.map((x,i)=>`<div class="rv bd"><div><b>${esc(x.job)}</b><div class="mu">Khách: ${esc(x.client)} · ${esc(x.price||"")}</div></div><span><button class="btn g" onclick="endJob(${i},'done')">✅ Hoàn thành</button> <button class="btn g" onclick="endJob(${i},'cancel')">Không làm được → Đang rảnh</button></span></div>`).join("")}</div>`}
function setBusy(b){DB=load("tv_db")||DB;const me=myShop();me.busy=b;save();vShop()}
function endJob(i,how){if(!confirm(how==="done"?"Hoàn thành công việc này và chuyển sang Đang rảnh?":"Xác nhận không làm được việc này? Trạng thái sẽ chuyển lại thành Đang rảnh và chủ dự án sẽ được báo."))return;
DB=load("tv_db")||DB;const me=myShop(),a=me.active.splice(i,1)[0];if(!me.active.length)me.busy=false;
if(how==="cancel"){const cv=(DB.convs||[]).find(z=>z.id===a.cid);if(cv)cv.msgs.forEach(m=>{if(m.offer&&m.offer.job===a.job&&m.offer.st==="ok")m.offer.st="cancel"})}
if(a.jobId){const j=DB.jobs.find(x=>x.id===a.jobId);if(j&&j.chosen===me.id){if(how==="done"){j.doneReq=Date.now();enqueue(()=>api("job_done_request",{job:j.id}),false).catch(()=>{})}else j.chosen=0}}save();
pushMsg(a.cid,{f:"w",t:how==="done"?`✅ Mình đã hoàn thành "${a.job}".`:`⚠️ Xin lỗi, mình không thể làm "${a.job}" được nữa. Mình đã chuyển về trạng thái đang rảnh.`});vShop()}
function vShop(){const me=myShop();if(!me||edit)return vForm(me);migrateGallery(me);
$("#app").innerHTML=`<h1 style="max-width:680px;margin:8px auto">Gian hàng của tôi</h1><div style="max-width:680px;margin:0 auto 12px">${statusCard(me)}</div>${cvPage(me,{own:1,act:'<button class="btn g" id="ed">Sửa thông tin</button>'})}`;
$("#ed").onclick=()=>{edit=true;vShop()}}
function vForm(me){const m=me||{name:S.name,cat:CATS[0],city:"",rate:"",exp:"",bio:"",skills:[]};let cat=m.cat,sel=new Set(m.skills.filter(s=>SKILLS[m.cat].includes(s))),photo=m.photo||"";const D2={};SEC.forEach(s=>D2[s.k]=JSON.parse(JSON.stringify(m[s.k]||[])));
const ents=k=>{const s=SEC.find(x=>x.k===k);return D2[k].map((it,i)=>`<div class="ent gr"><button class="x" data-del="${k}:${i}" title="Xoá">✕</button>${s.f.map(([f,l,t])=>`<label class="fl ${t==="h"?"h":""}"><span>${l}</span>${t==="a"?`<textarea data-k="${k}" data-i="${i}" data-f="${f}">${esc(it[f]||"")}</textarea>`:`<input data-k="${k}" data-i="${i}" data-f="${f}" value="${esc(it[f]||"")}">`}</label>`).join("")}</div>`).join("")};
const pho=()=>photo?`<img src="${photo}" alt="">`:ini(m.name);
$("#app").innerHTML=`<h1>${me?"Thông tin của tôi":"Tạo gian hàng của bạn"}</h1><div class="cv"><div class="cvh"><label class="avu" title="Đổi ảnh đại diện"><span id="pvw" style="display:contents">${pho()}</span><input type="file" accept="image/*" id="ph" hidden></label><div style="flex:1;display:grid;gap:8px"><div style="font-size:13px">Ảnh chân dung: nên chụp rõ mặt, nền sáng</div><input id="a1" placeholder="Họ và tên" value="${esc(m.name)}"><select id="a2">${catOpts()}</select></div></div>
<div class="cvb"><div class="cvs"><h3>Thông tin cơ bản</h3><div class="gr">${fh("Tỉnh/thành phố làm việc",cityInp("a3",m.city))}<div class="fl"><span>Giá nhận việc</span><div class="rr">${moneyInp("a4",m.rate)}<label class="ck"><input type="checkbox" id="neg" ${m.negot?"checked":""}> Thỏa thuận</label></div></div>${fh("Số năm kinh nghiệm",`<input id="a5" type="number" min="0" value="${m.exp}">`)}${fh("Giới tính",`<select id="gd"><option value="">—</option><option>Nam</option><option>Nữ</option><option>Khác</option></select>`)}${fh("Năm sinh",`<input id="by" type="number" min="1940" max="2010" placeholder="VD: 1990" value="${m.byear||""}">`)}${fh("Số điện thoại",`<input id="tel" type="tel" value="${esc(m.phone||"")}">`)}${fld("Email",`<input id="mail" type="email" value="${esc(m.cmail||"")}">`)}<label class="mu" style="grid-column:1/-1"><input type="checkbox" id="pub" ${m.pub?"checked":""}> Cho chủ dự án xem số điện thoại & email trên hồ sơ (nếu không chọn, họ liên hệ qua tin nhắn)</label></div></div>
<div class="cvs"><h3>Kỹ năng</h3><div class="chips" id="sk"></div><div style="margin-top:10px">${fld("Kỹ năng khác chưa có trong danh sách (cách nhau dấu phẩy)",`<input id="a6" placeholder="VD: Hàn nhôm kính" value="${esc(m.skills.filter(s=>!SKILLS[m.cat].includes(s)).join(", "))}">`)}</div></div>
<div class="cvs"><h3>Giới thiệu / Mục tiêu nghề nghiệp</h3><textarea id="a7" style="min-height:100px" placeholder="Giới thiệu ngắn về bản thân, thế mạnh và loại công việc bạn muốn nhận">${esc(m.bio)}</textarea></div>
${SEC.map(s=>`<div class="cvs"><h3>${s.t}</h3><div id="s-${s.k}">${ents(s.k)}</div><button class="btn g" data-add="${s.k}">${s.add}</button></div>`).join("")}
<div class="sv"><button class="btn" id="sb">Lưu thông tin</button>${me?'<button class="btn g" id="cc">Huỷ</button>':""}<span class="err" id="er"></span></div></div></div>`;
$("#a2").value=m.cat;$("#gd").value=m.gender||"";
const draw=()=>{$("#sk").innerHTML=SKILLS[cat].map(s=>`<span class="chip ${sel.has(s)?"on":""}" data-s="${esc(s)}">${esc(s)}</span>`).join("")};draw();
const cv=$(".cv");
cv.addEventListener("input",e=>{const t=e.target.dataset;if(t.k)D2[t.k][+t.i][t.f]=e.target.value});
cv.addEventListener("click",e=>{const t=e.target.dataset;if(t.s){sel.has(t.s)?sel.delete(t.s):sel.add(t.s);draw()}else if(t.add){D2[t.add].push({});$("#s-"+t.add).innerHTML=ents(t.add)}else if(t.del){const[k,i]=t.del.split(":");D2[k].splice(+i,1);$("#s-"+k).innerHTML=ents(k)}});
$("#a2").onchange=e=>{cat=e.target.value;sel=new Set([...sel].filter(s=>SKILLS[cat].includes(s)));draw()};
$("#ph").onchange=e=>rd(e.target.files[0],d=>shrinkPortrait(d,480,600,p=>{photo=p;$("#pvw").innerHTML=pho()}));
if($("#cc"))$("#cc").onclick=()=>{edit=false;vShop()};
$("#sb").onclick=()=>{const v=i=>$("#"+i).value.trim(),city=normCity(v("a3")),rate=moneyVal("a4"),neg=$("#neg").checked,err=t=>$("#er").textContent=t;
const sk=[...new Set([...sel,...v("a6").split(",").map(s=>s.trim()).filter(Boolean)])];
if(!v("a1"))return err("Vui lòng nhập họ tên.");if(!cityOk(city))return err("Hãy chọn tỉnh/thành phố trong danh sách gợi ý.");if(!rate&&!neg)return err("Hãy nhập giá nhận việc, hoặc tick \"Thỏa thuận\" nếu giá tuỳ công việc.");if(!sk.length)return err("Hãy chọn ít nhất 1 kỹ năng để chủ dự án biết bạn làm được gì.");
const d={name:v("a1"),cat:v("a2"),city,rate,negot:neg,exp:+v("a5")||0,bio:v("a7"),skills:sk,photo,gender:v("gd"),byear:v("by"),phone:v("tel"),cmail:v("mail"),pub:$("#pub").checked};
SEC.forEach(s=>d[s.k]=D2[s.k].map(o=>Object.fromEntries(Object.entries(o).map(([a,b])=>[a,String(b||"").trim()]))).filter(o=>Object.values(o).some(Boolean)));
if(me)Object.assign(me,d);else DB.workers.push({id:nid(),email:S.email,...d,gallery:[],reviews:[]});edit=false;save();vShop()}}
function route(){if(!guard("tho"))return;const h=location.hash.slice(1)||"viec";
if(!["viec","bao","gianhang","taikhoan"].includes(h)){location.hash="viec";return}
$("#nav").innerHTML=navHtml("tho",h);if(h!=="gianhang")edit=false;
({viec:vViec,bao:vBids,gianhang:vShop,taikhoan:vAccount})[h]();scrollTo(0,0)}
startPage();
</script><script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script><script src="/notifications.js" defer></script></body></html>
