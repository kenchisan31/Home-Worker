<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ThợViệt – Dành cho doanh nghiệp</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#e8590c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ThợViệt"></head><body>
<header><div class="in nav" id="nav"></div></header><main class="in" id="app"></main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
let fq="",fc="",fp="",fs="",rating=5,rImg="";

const card=w=>`<div class="card h" onclick="location.hash='w-${w.id}'">${cph(w)}<div style="margin-top:10px"><b>${esc(w.name)}</b><div class="mu">${ICON[w.cat]} ${w.cat} · ${esc(normCity(w.city))}</div>${badge(w)}</div><div style="margin:8px 0"><span class="st">${stars(avg(w))}</span> <b>${avg(w).toFixed(1)}</b> <span class="mu">(${w.reviews.length})</span></div>${skillTags(w.skills,5)}<div style="margin-top:6px"><b>${rateTxt(w)}</b></div></div>`;
const flt=()=>DB.workers.filter(w=>w.kind!=="shop"&&(!fc||w.cat===fc)&&(!fp||normCity(w.city)===fp)&&(!fs||w.skills.includes(fs))&&(!fq||kwMatch([w.name,w.cat,normCity(w.city),w.skills.join(" "),w.bio||""].join(" "),fq))).sort((a,b)=>avg(b)-avg(a));
function vTho(){const sks=[...new Set([...(fc?SKILLS[fc]:Object.values(SKILLS).flat()),...DB.workers.filter(w=>w.kind!=="shop"&&(!fc||w.cat===fc)).flatMap(w=>w.skills)])];
$("#app").innerHTML=`<h1>Tìm thợ cho dự án của bạn</h1><div class="mu">Xem gian hàng, đánh giá và ảnh công trình thực tế trước khi thuê.</div><div class="flt"><input id="q" class="q" type="search" placeholder="Tìm tên, kỹ năng, khu vực… (VD: điện mặt trời)" value="${esc(fq)}"><select id="c">${catOpts(1)}</select><div class="cb" id="cb-p"></div><div class="cb sk" id="cb-s"></div></div><div class="grid" id="lst">${flt().map(card).join("")||'<p class="mu">Không có kết quả.</p>'}</div>`;
$("#c").value=fc;comboInit("cb-p",PROV.map(p=>p[0]),fp,"Tất cả tỉnh/thành",v=>{fp=v;vTho()},provAlias);comboInit("cb-s",sks,fs,"Tất cả kỹ năng",v=>{fs=v;vTho()});
$("#q").oninput=e=>{fq=e.target.value;$("#lst").innerHTML=flt().map(card).join("")||'<p class="mu">Không có kết quả.</p>'};$("#c").onchange=e=>{fc=e.target.value;fs="";vTho()}}
function vProfile(id){const w=wid(id);if(!w||w.kind==="shop"){location.hash="tho";return}rating=5;rImg="";
const hf=`<div class="f" id="hf" hidden style="border:1px solid var(--bd);border-radius:10px;padding:12px"><b>Đề nghị thuê</b><select id="hj"><option value="0">— Chọn dự án của tôi (tuỳ chọn) —</option>${DB.jobs.filter(j=>j.by===S.email).map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join("")}</select><input id="hn" placeholder="Tên công việc cần thuê">${moneyInp("hp",w.rate)}<input id="hd" placeholder="Số công dự kiến (VD: 5 công)"><textarea id="ho" placeholder="Ghi chú: địa điểm, ngày bắt đầu…"></textarea><div><button class="btn" id="hs">Gửi đề nghị thuê & nhắn tin</button></div></div>`,
rv=`<div class="card" style="margin-bottom:10px"><b>Viết đánh giá</b> <span class="mu">(với tên ${esc(S.name)})</span><div class="f"><div class="pick" id="pk">${[1,2,3,4,5].map(i=>`<span data-i="${i}" class="on">★</span>`).join("")}</div><textarea id="rt" placeholder="Chia sẻ trải nghiệm làm việc với thợ này…"></textarea><label class="mu">Ảnh minh chứng (tuỳ chọn): <input type="file" accept="image/*" id="ri"></label><div><button class="btn" id="rs">Gửi đánh giá</button></div></div></div>`;
$("#app").innerHTML=`<p style="max-width:680px;margin:8px auto"><a href="#tho">← Quay lại</a></p>${cvPage(w,{act:`<button class="btn g" onclick="openChat(${w.id})">💬 Nhắn tin</button> <button class="btn" id="hb">Thuê</button>`,top:hf,rev:rv})}`;
$("#hb").onclick=()=>{const f=$("#hf");f.hidden=!f.hidden};
$("#hj").onchange=e=>{const j=DB.jobs.find(x=>x.id===+e.target.value);if(j){$("#hn").value=j.title;$("#hp").value=dots(j.budget);$("#hd").value=j.days||""}};
$("#hs").onclick=()=>{const n=$("#hn").value.trim();if(!n){alert("Nhập tên công việc.");return}openChat(w.id,{job:n,jobId:+$("#hj").value,price:moneyVal("hp"),days:$("#hd").value.trim(),note:$("#ho").value.trim(),st:"pending"});$("#hf").hidden=true};
$("#pk").onclick=e=>{const i=+e.target.dataset.i;if(!i)return;rating=i;[...$("#pk").children].forEach((s,k)=>s.classList.toggle("on",k<i))};$("#ri").onchange=e=>rd(e.target.files[0],d=>rImg=d);
$("#rs").onclick=()=>{const t=$("#rt").value.trim();if(!t){alert("Vui lòng nhập nội dung.");return}w.reviews.unshift({n:S.name,s:rating,t,img:rImg,d:new Date().toLocaleDateString("vi-VN")});save();vProfile(id)}}
let jp=[];
function jpDraw(){const d=$("#apv");if(d)d.innerHTML=jp.map((s,i)=>`<div class="ph"><img src="${s}" alt=""><button class="btn g" style="position:absolute;top:4px;right:4px;min-height:0;padding:2px 8px" onclick="jpDel(${i})">✕</button></div>`).join("")}
function jpDel(i){jp.splice(i,1);jpDraw()}
function vPost(){jp=[];$("#app").innerHTML=`<p style="margin:8px 0"><a href="#duan">← Dự án của tôi</a></p><h1>Đăng dự án tuyển thợ</h1><div class="card"><div class="f" style="max-width:520px"><input id="a1" placeholder="Tên dự án"><select id="a2">${catOpts()}</select>${cityInp("a3","")}<input id="a7" placeholder="Địa chỉ cụ thể: số nhà, đường, phường/xã… (để thợ xem bản đồ)"><div class="rr">${moneyInp("a4","")}<label class="ck"><input type="checkbox" id="neg"> Thỏa thuận</label></div><input id="a5" placeholder="Số công dự kiến (VD: 10 công)"><textarea id="a6" placeholder="Mô tả công việc"></textarea><div class="fl"><span>Ảnh dự án (tuỳ chọn, tối đa 4 ảnh)</span><input type="file" id="ap" accept="image/*" multiple><div class="gal" id="apv" style="margin-top:8px"></div></div><div><button class="btn" id="sb">Đăng dự án</button></div></div></div>`;
$("#ap").onchange=e=>{const fs=[...e.target.files].slice(0,Math.max(0,4-jp.length));if(e.target.files.length>fs.length)alert("Tối đa 4 ảnh cho mỗi dự án.");fs.forEach(f=>rd(f,d=>shrinkMax(d,1280,s=>{if(jp.length<4){jp.push(s);jpDraw()}})));e.target.value=""};
$("#sb").onclick=()=>{const v=i=>$("#a"+i).value.trim();const neg=$("#neg").checked,pr=moneyVal("a4");if(!v(1)||(!pr&&!neg)){alert("Vui lòng nhập tên dự án và giá/công (hoặc tick Thỏa thuận).");return}if(!cityOk(normCity(v(3)))){alert("Hãy chọn tỉnh/thành phố trong danh sách gợi ý.");return}DB.jobs.unshift({id:nid(),title:v(1),cat:v(2),city:normCity(v(3)),budget:pr+(neg?(pr?" · Thỏa thuận":"Thỏa thuận"):""),days:v(5),desc:v(6),addr:v(7),photos:jp.slice(),by:S.email,byName:S.name,byLogo:S.logo||"",chosen:0,bids:[]});save();location.hash="duan"}}
function vMyJobs(){const l=DB.jobs.filter(j=>j.by===S.email);$("#app").innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h1 style="margin:8px 0">Dự án của tôi</h1><a class="btn" href="#dangduan" style="text-decoration:none">＋ Đăng dự án</a></div><div class="mu">Xem báo giá từ thợ và chọn người phù hợp.</div><div style="margin-top:12px;display:grid;gap:12px">${l.map(j=>`<div class="card"><span class="tag">${ICON[j.cat]} ${j.cat}</span><h3 style="margin:6px 0">${esc(j.title)}</h3><div class="mu">📍 ${esc(jAddr(j))}${j.addr?` <a href="${esc(mapUrl(j))}" target="_blank" rel="noopener">(bản đồ)</a>`:""} · 💰 ${esc(j.budget)}${j.days?" · "+esc(j.days):""}</div><p>${esc(j.desc)}</p>${jobPh(j)}<b>${j.bids.length} báo giá</b>${j.bids.map(b=>{const w=wid(b.w);return w?`<div class="rv bd"><div><a href="#w-${w.id}">${esc(w.name)}</a> · <b>${esc(b.p)}</b><div class="mu">${esc(b.m)}</div></div><span><button class="btn g" onclick="openChat(${w.id})">💬</button> ${j.chosen===w.id?(j.done?'<span class="tag">🏁 Đã hoàn thành</span>':'<span class="tag">'+(j.doneReq?'🔔 Thợ báo đã xong':'✅ Đã chọn')+'</span> <button class="btn" onclick="confirmDone('+j.id+')">Xác nhận hoàn thành</button>'):j.chosen?"":`<button class="btn g" onclick="choose(${j.id},${w.id})">Chọn thợ</button>`}</span></div>`:""}).join("")}<div style="margin-top:12px"><button class="btn g" onclick="delJob(${j.id})">🗑 Xoá dự án</button></div></div>`).join("")||'<p class="mu">Bạn chưa đăng dự án nào. Hãy bấm "Đăng dự án".</p>'}</div>`}
function delJob(id){const j=DB.jobs.find(x=>x.id===id);if(!j)return;
if(!confirm("Xoá dự án \""+j.title+"\"?"+(j.bids.length?"\nCác báo giá của thợ cho dự án này cũng sẽ bị xoá.":"")+"\nKhông thể khôi phục."))return;
enqueue(async()=>{try{await api("job_delete",{id})}catch(e){if(e.status!==404)throw e}const i=DB.jobs.findIndex(x=>x.id===id);if(i>=0)DB.jobs.splice(i,1);delete SNAP.j[id];delete SNAP.c[id]},true).then(()=>vMyJobs()).catch(e=>alert("Không xoá được: "+viErr(e)))}
function confirmDone(id){const j=DB.jobs.find(x=>x.id===id);if(!j||!j.chosen)return;if(!confirm("Xác nhận thợ đã hoàn thành công việc này?\nSau khi xác nhận sẽ không đổi lại được, và đánh giá của bạn về thợ sẽ được gắn nhãn đã xác thực."))return;
enqueue(async()=>{await api("job_done_confirm",{job:id});j.done=true;j.doneAt=Date.now()},false).then(()=>vMyJobs()).catch(()=>{})}
function choose(j,w){DB.jobs.find(x=>x.id===j).chosen=w;save();vMyJobs()}


/* ---------- CHỢ vật liệu xây dựng: chỉ chủ dự án xem được ---------- */
let cq="",cc="",cp="";
const shopsAll=()=>DB.workers.filter(w=>w.kind==="shop");
const myCities=()=>new Set(DB.jobs.filter(j=>j.by===S.email).map(j=>normCity(j.city)));
const chFlt=()=>{const near=myCities();return shopsAll().filter(w=>(!cc||w.cat===cc)&&(!cp||normCity(w.city)===cp)&&(!cq||kwMatch([w.name,w.cat,normCity(w.city),w.addr||"",(w.skills||[]).join(" "),w.bio||""].join(" "),cq))).sort((a,b)=>near.has(normCity(b.city))-near.has(normCity(a.city))||b.id-a.id)};
const chCard=w=>shopCard(w,{near:!cp&&myCities().has(normCity(w.city)),act:`<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="openChat(${w.id})">💬 Nhắn tin hỏi giá</button>${w.phone?`<a class="btn g" href="${esc(telHref(w.phone))}" style="text-decoration:none">📞 Gọi</a>`:""}</div>`});
const chList=()=>chFlt().map(chCard).join("")||'<p class="mu">Chưa có nhà phân phối nào phù hợp. Hãy thử đổi bộ lọc hoặc từ khoá.</p>';
function vCho(){$("#app").innerHTML=`<h1>Chợ vật liệu xây dựng</h1><div class="mu">Tìm nhà phân phối sắt thép, xi măng, sơn, thiết bị vệ sinh, dây điện… gần dự án của bạn. Nhắn tin trực tiếp để hỏi giá theo tấn hoặc theo lô.</div><div class="flt"><input id="q" class="q" type="search" placeholder="Tìm tên cửa hàng, sản phẩm, khu vực… (VD: thép Hòa Phát)" value="${esc(cq)}"><select id="c">${shopCatOpts(1)}</select><div class="cb" id="cb-p"></div></div><div class="grid" id="lst">${chList()}</div>`;
$("#c").value=cc;comboInit("cb-p",PROV.map(p=>p[0]),cp,"Tất cả tỉnh/thành",v=>{cp=v;vCho()},provAlias);
$("#q").oninput=e=>{cq=e.target.value;$("#lst").innerHTML=chList()};$("#c").onchange=e=>{cc=e.target.value;vCho()}}
function route(){if(!guard("biz"))return;const h=location.hash.slice(1)||"tho",isW=/^w-\d+$/.test(h);
if(!["tho","cho","duan","dangduan","taikhoan"].includes(h)&&!isW){location.hash="tho";return}
$("#nav").innerHTML=navHtml("biz",h,isW);
if(isW)vProfile(+h.slice(2));else({tho:vTho,cho:vCho,duan:vMyJobs,dangduan:vPost,taikhoan:vAccount})[h]();scrollTo(0,0)}
startPage();
</script><script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script></body></html>
